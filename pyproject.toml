[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-authorization-app"
version = "0.1.0"
description = "AI-powered prior authorization validation system for healthcare providers"
authors = [{name = "Healthcare Team", email = "team@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "dataclasses-json>=0.6.3",
    "structlog>=23.2.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-mock>=3.12.0",
    "moto>=4.2.14",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "hypothesis>=6.92.0",
]
cdk = [
    "aws-cdk-lib>=2.110.0",
    "constructs>=10.0.0,<11.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]